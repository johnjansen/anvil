<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="anvil-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BB3F0"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
  </defs>
  <!-- Anvil body -->
  <g transform="translate(100,105)">
    <!-- Horn (top left projection) -->
    <path d="M-60,-45 Q-75,-48 -80,-40 Q-82,-35 -70,-32 L-45,-32 Z" fill="url(#anvil-grad-dark)"/>
    <!-- Face (top surface) -->
    <rect x="-45" y="-50" width="90" height="18" rx="3" fill="url(#anvil-grad-dark)"/>
    <!-- Step -->
    <rect x="-45" y="-32" width="50" height="14" rx="2" fill="url(#anvil-grad-dark)"/>
    <!-- Body / waist -->
    <path d="M-30,-18 L-20,30 L60,30 L50,-18 Z" fill="url(#anvil-grad-dark)"/>
    <!-- Base -->
    <rect x="-35" y="30" width="100" height="16" rx="4" fill="url(#anvil-grad-dark)"/>
    <!-- Highlight on face -->
    <rect x="-42" y="-48" width="84" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
    <!-- Subtle hammer spark -->
    <circle cx="0" cy="-58" r="3" fill="#F5C842" opacity="0.9"/>
    <line x1="-8" y1="-65" x2="-4" y2="-60" stroke="#F5C842" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="8" y1="-65" x2="4" y2="-60" stroke="#F5C842" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="0" y1="-70" x2="0" y2="-63" stroke="#F5C842" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
