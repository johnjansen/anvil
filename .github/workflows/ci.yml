name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o anvil ./cmd/anvil

      - name: Run tests
        run: go test ./...

      - name: Verify binary runs
        run: |
          ./anvil version
          ./anvil help

  tag-release:
    name: Tag release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            # Parse major.minor.patch
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)

            # Check if any commit since last tag contains "fix:" for patch bump
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" --no-merges)
            if echo "$COMMITS" | grep -qi "^fix:"; then
              # If there are also feat: commits, bump minor
              if echo "$COMMITS" | grep -qi "^feat:"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
            else
              # Default: bump minor for new features
              MINOR=$((MINOR + 1))
              PATCH=0
            fi

            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Check if tag already exists (no new commits since last tag)
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $NEXT_TAG already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
            echo "Next version: $NEXT_TAG"
          fi

      - name: Check for new commits since last tag
        id: check
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "No new commits since $LATEST_TAG"
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "$COMMIT_COUNT commits since $LATEST_TAG"
            fi
          fi

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true' && steps.check.outputs.has_changes == 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"
